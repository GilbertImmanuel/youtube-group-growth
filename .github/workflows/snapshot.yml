name: snapshot

# Daily channel-stats snapshot. View velocity cannot be reconstructed later, so
# record it now. Needs the YOUTUBE_API_KEY repository secret.
on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record snapshot
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.collect.snapshot
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/channel_stats.csv
          git diff --cached --quiet || git commit -m "ops: daily channel stats snapshot"
          git push

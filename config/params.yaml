# Thresholds live here, not inline in code, so changing a value changes it
# everywhere it is used.

# Long-form split on contentDetails.duration. Videos at or below the threshold
# are shorts. Sensitivity check re-runs the split at 180 seconds.
shorts_threshold_seconds: 60
shorts_threshold_sensitivity_seconds: 180

# Videos younger than this at snapshot time are dropped.
min_video_age_days: 180

# Event-study window in months around the join event, inclusive.
event_window_months: [-24, 24]

# Controls matched per treated creator, 8 to 10.
match_ratio: 10

# Window before treatment over which control-matching balance covariates (mean
# log views per long-form video, long-form upload count) are measured.
matching_pretreatment_months: 12

# Nearest candidate controls kept per treated unit, by standardised pre-treatment
# covariate distance. 1 is nearest-neighbour matching, which minimised the balance
# metric in Loop B (loops/matching/log.md); raise it to trade balance for control count.
matching_neighbors: 1

# Phase 6 causal inference (Q4, Q5). The staggered DiD is estimated once against the
# frozen panel; these constants fix the resampling so a re-run reproduces the intervals.

# Wild cluster bootstrap draws for the DiD confidence intervals. Clustering is at the
# ecosystem level (5 clusters), so Webb six-point weights are used, not Rademacher:
# 2^5 Rademacher sign vectors are too few to trace a distribution at this cluster count.
wild_bootstrap_iterations: 999

# Placebo re-estimations: fake join dates on the treated pre-period, and a controls-only
# fake-treatment run. The two distributions should centre near zero. 200 bounds the runtime;
# a placebo summary (mean, dispersion, quantiles) is stable well below the bootstrap count.
placebo_iterations: 200

# Fixed RNG seed for every resampling step in Phase 6.
rng_seed: 20260827

# Q5 splits treated members by pre-join size into two arms at the median of the size
# proxy (mean log-views over the pre-treatment window). median or terciles.
q5_split: median
